[build-system]
requires = ["setuptools>=70.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "panorama"
version = "0.2.4"
description = "Python wrapper for Amsterdam Panorama API."
authors = [
    {name = "Thomas Brockmeier", email = "t.brockmeier@amsterdam.nl"},
    {name = "Daan Bloembergen", email = "d.bloembergen@amsterdam.nl"},
]
maintainers = [
    { name = "Computer Vision Team, Gemeente Amsterdam", email = "cvt@amsterdam.nl" },
]
readme = "README.md"
requires-python = ">=3.7"
dependencies = [
    "httpx~=0.23.0",
    "pydantic~=1.8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.2.0",
    "vcrpy>=4.1.1",
    "black>=22.10",
    "mypy>=0.910",
    "isort>=5.9.3",
    "pylint>=2.11.1",
    "pytest-cov>=2.12.1",
    "pytest-asyncio>=0.15.1",
    "pytest-vcr>=1.0.2",
    "haversine>=2.5.1",
    "Sphinx>=4.2.0",
    "typing-extensions>=4.4",
]
