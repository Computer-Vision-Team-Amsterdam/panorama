# Python package
# Create and test a Python package on multiple Python versions.
# Add steps that analyze code, save the dist with the build record, publish to a PyPI-compatible index, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/python

trigger:
- main

jobs:
  - job: Linux
    pool:
      vmImage: ubuntu-latest
    strategy:
      matrix:
        Python3.10:
          python.version: '3.10'
        Python3.12:
          python.version: '3.12'
        Python3.14:
          python.version: '3.14'
    steps:
      - task: UsePythonVersion@0
        inputs:
          versionSpec: '$(python.version)'
        displayName: 'Use Python $(python.version)'

      - script: |
          python -m pip install --upgrade pip
          pip install uv
          uv venv --python $(python.version)
          source .venv/bin/activate
          uv pip install -r pyproject.toml
        displayName: 'Install dependencies'

      - script: |
          uv run pytest -s --cov=panorama --cov-report term-missing
        displayName: 'pytest'

  - job: OSX
    pool:
      vmImage: macOS-latest
    strategy:
      matrix:
        Python3.10:
          python.version: '3.10'
        Python3.12:
          python.version: '3.12'
        Python3.14:
          python.version: '3.14'
    steps:
      - task: UsePythonVersion@0
        inputs:
          versionSpec: '$(python.version)'
        displayName: 'Use Python $(python.version)'

      - script: |
          python -m pip install --upgrade pip
          pip install uv
          uv venv --python $(python.version)
          source .venv/bin/activate
          uv pip install -r pyproject.toml
        displayName: 'Install dependencies'

      - script: |
          uv run pytest -s --cov=panorama --cov-report term-missing
        displayName: 'pytest'

  - job: Style
    pool:
      vmImage: ubuntu-latest
    strategy:
      matrix:
        Python3.14:
          python.version: '3.14'
    steps:
      - task: UsePythonVersion@0
        inputs:
          versionSpec: '$(python.version)'
        displayName: 'Use Python $(python.version)'

      - script: |
          python -m pip install --upgrade pip
          pip install uv
          uv venv --python $(python.version)
          source .venv/bin/activate
          uv pip install -r pyproject.toml
        displayName: 'Install dependencies'

      - script: |
          uv run isort panorama tests
        displayName: 'isort'

      - script: |
          uv run black .
        displayName: 'black'

      - script: |
          uv run mypy --config-file=.mypyrc panorama tests
        displayName: 'mypy'

      - script: |
          uv run pylint --jobs=0 --rcfile=.pylintrc panorama tests
        displayName: 'pylint'
